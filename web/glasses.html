<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="description" content="Your Agent Guild sessions, and their last answers read aloud.">
  <title>Agent Guild</title>
  <link rel="icon" href="/brand/favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 600px; height: 600px; overflow: hidden; background: #000; color: #fff; }
    body { font: 22px/1.3 system-ui, sans-serif; }
    main { padding: 20px 24px; height: 600px; display: flex; flex-direction: column; gap: 10px; }
    [hidden] { display: none !important; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 30px; line-height: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .count, .note { color: #c8c8c8; }
    .note { margin: 0; font-size: 22px; }
    .label { margin: 0; color: #ffd27a; font-size: 24px; }
    button { display: block; width: 100%; min-height: 88px; padding: 10px 18px; border: 2px solid #5a5a5a; border-radius: 16px;
      background: transparent; color: #fff; font: inherit; font-size: 26px; text-align: left; outline: none; }
    button:focus { border: 4px solid #ffd27a; background: rgba(255, 210, 122, 0.16); }
    .row { display: flex; flex-direction: column; justify-content: center; }
    .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .label { font-size: 20px; }
  </style>
</head>
<body>
  <main id="list">
    <header><h1>Sessions</h1><span id="count" class="count"></span></header>
    <p id="list-note" class="note" role="status"></p>
    <button class="row" type="button" hidden><span class="name"></span><span class="label"></span></button>
    <button class="row" type="button" hidden><span class="name"></span><span class="label"></span></button>
    <button class="row" type="button" hidden><span class="name"></span><span class="label"></span></button>
    <button class="row" type="button" hidden><span class="name"></span><span class="label"></span></button>
  </main>
  <main id="detail" hidden>
    <header><h1 id="detail-name"></h1></header>
    <p id="detail-label" class="label"></p>
    <button id="listen" type="button">Listen</button>
    <button id="back" type="button">Back</button>
    <p id="detail-note" class="note" role="status"></p>
  </main>
  <script type="module" src="/glasses.js"></script>
</body>
</html>
