# Temporary, removed straight after its one run. Seals the Apple signing secrets to agent-guild-companions'
# release-signing environment, whose public key is fixed here, so only GitHub can open them. Everything
# this workflow outputs is ciphertext, and no token for the other repository is involved.
name: Copy signing secrets to agent-guild-companions

on:
  workflow_dispatch:

permissions: {}

jobs:
  seal:
    name: Seal
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-signing
    steps:
      - name: Fetch libsodium, checked against its npm integrity
        working-directory: ${{ runner.temp }}
        run: |
          fetch() {
            curl --fail --location --silent --show-error --output "$1.tgz" "https://registry.npmjs.org/$1/-/$1-0.8.4.tgz"
            [ "$(openssl dgst -sha512 -binary "$1.tgz" | base64 --wrap=0)" = "$2" ]
            mkdir -p "node_modules/$1"
            tar -xzf "$1.tgz" -C "node_modules/$1" --strip-components=1
          }
          fetch libsodium lMcYaRi0zcs7tarATsQUYC7rstliIXZuoq0c6zXSgNtSNtdvBgkSegjWhpMJAXzKX3SUSwIp7+zEsob+j3LuRw==
          fetch libsodium-wrappers mu8aAWucZjTB5O/BtGXtW4e1agy7uHxNYG7zPthmmD1jU43LCDmSWZLN4JhflbdPXj3yDO4lxM1O9hLDgIOXDw==
      - name: Seal the secrets
        working-directory: ${{ runner.temp }}
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          cat > seal.cjs <<'SCRIPT'
          const fs = require('node:fs');
          const sodium = require('libsodium-wrappers');
          const KEY = '1bcuZ2vvMCfoK7GeFvitiF5J9pfdscNcH/4/hhO83TI=';
          const KEY_ID = '3380204578043523366';
          const NAMES = ['APPLE_DEVELOPER_ID_APPLICATION_P12', 'APPLE_P12_PASSWORD', 'APPLE_NOTARY_KEY_P8'];
          sodium.ready.then(() => {
            const { ORIGINAL } = sodium.base64_variants;
            const key = sodium.from_base64(KEY, ORIGINAL);
            const sealed = {};
            for (const name of NAMES) {
              if (!process.env[name]) throw new Error(`${name} is empty`);
              sealed[name] = { key_id: KEY_ID, encrypted_value: sodium.to_base64(sodium.crypto_box_seal(sodium.from_string(process.env[name]), key), ORIGINAL) };
            }
            fs.mkdirSync('sealed');
            fs.writeFileSync('sealed/sealed.json', JSON.stringify(sealed));
          });
          SCRIPT
          node seal.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealed
          path: ${{ runner.temp }}/sealed/sealed.json
          if-no-files-found: error
          retention-days: 1
