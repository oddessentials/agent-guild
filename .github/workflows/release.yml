name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .github/release
      - id: plan
        env:
          RELEASE_PLAN_DIR: ${{ runner.temp }}/release-plan
        run: |
          git clone --quiet --bare . "$RUNNER_TEMP/origin.git"
          node .github/release/node_modules/semantic-release/bin/semantic-release.js --dry-run --repository-url "file://$RUNNER_TEMP/origin.git"
          if [ -f "$RELEASE_PLAN_DIR/version" ]; then
            version=$(cat "$RELEASE_PLAN_DIR/version")
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The planned version \"$version\" is not a plain release version."
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/notes.md
          if-no-files-found: error
          retention-days: 7

  # Smart App Control blocks node-pty's unsigned Windows modules. Each release signs its own copies,
  # and ci.yml packs them in place of node-pty's and checks the tarball before anything is published.
  sign:
    name: Sign
    needs: plan
    if: needs.plan.outputs.version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/sign.yml

  ci:
    name: CI
    needs: [plan, sign]
    if: needs.plan.outputs.version != ''
    # The CI matrices cancel the run on their first failure.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  installers:
    name: Installers
    needs: [plan, ci]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/installers.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  # npm only gets a version whose art pack is on its release: the release is a
  # draft holding the pack, checked against the package's manifest, until npm has it.
  draft:
    name: Draft release with the Yard art and installers
    needs: [plan, ci, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-linux
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          tag="v$VERSION"
          installers=("agent-guild-$VERSION-windows-setup.exe" "agent-guild-$VERSION-linux-x64.tar.gz" "agent-guild-$VERSION-linux-arm64.tar.gz")
          sha256sum -- "${installers[@]}" >> SHA256SUMS
          art() { tar -xzOf ./*.tgz package/web/yard/art.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).archive.$1"; }
          name=$(art name)
          url=$(art url)
          sha=$(art sha256)
          if [ "$url" != "https://github.com/$GH_REPO/releases/download/$tag/$name" ]; then
            echo "::error::The package names the art pack $url, not $name on the $tag release."
            exit 1
          fi
          echo "$sha  $name" | sha256sum --check
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "Release $tag is already public."
          elif [ "$state" = true ]; then
            gh release upload "$tag" --clobber ./*.tgz "$name" "${installers[@]}" SHA256SUMS
            gh release edit "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md ./*.tgz "$name" "${installers[@]}" SHA256SUMS
          fi
          # Check what the release holds, not what was sent.
          mkdir held
          gh release download "$tag" --pattern "$name" --dir held
          echo "$sha  held/$name" | sha256sum --check
          for file in "${installers[@]}"; do
            gh release download "$tag" --pattern "$file" --dir held
            cmp "$file" "held/$file"
          done

  publish:
    name: Publish to npm
    needs: [plan, ci, draft]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    outputs:
      name: ${{ steps.publish.outputs.name }}
      integrity: ${{ steps.publish.outputs.integrity }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - id: publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          tarball=$(echo ./*.tgz)
          manifest() { tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).$1"; }
          name=$(manifest name)
          packed=$(manifest version)
          if [ "$packed" != "$VERSION" ]; then
            echo "::error::The package is version $packed but the plan is $VERSION."
            exit 1
          fi
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w 0)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          published=$(npm view "$name@$VERSION" dist.integrity --prefer-online 2>/dev/null || true)
          if [ "$published" = "$integrity" ]; then
            echo "$name@$VERSION is already on npm with these contents."
          elif [ -n "$published" ]; then
            echo "::error::$name@$VERSION is already on npm with different contents. If an earlier release run published it and then failed, re-run the failed jobs of that run so it is tagged, then re-run this one."
            exit 1
          else
            npm publish "$tarball" --provenance --access public
          fi

  release:
    name: Tag and release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points at $tagged, not at $GITHUB_SHA."
              exit 1
            fi
          else
            gh api "repos/$GH_REPO/git/refs" --silent -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "Release $tag already exists."
          elif [ "$state" = true ]; then
            if ! gh release edit "$tag" --verify-tag --draft=false; then
              echo "::error::npm already has $VERSION, but release $tag is still a draft, so installs cannot download its Yard art yet. Re-run this job to make the release public."
              exit 1
            fi
          else
            echo "::error::There is no draft release $tag to publish."
            exit 1
          fi

  confirm:
    name: Install from npm
    needs: [plan, publish, release]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - env:
          PACKAGE: ${{ needs.publish.outputs.name }}@${{ needs.plan.outputs.version }}
          VERSION: ${{ needs.plan.outputs.version }}
          INTEGRITY: ${{ needs.publish.outputs.integrity }}
        run: |
          deadline=$((SECONDS + 60 * 60))
          until published=$(npm view "$PACKAGE" dist.integrity --prefer-online 2>npm-view.log) && [ -n "$published" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat npm-view.log
              echo "::error::npm still does not serve $PACKAGE an hour after it was published. Re-run this job once \"npm view $PACKAGE\" shows it."
              exit 1
            fi
            echo "npm is still processing $PACKAGE ($((SECONDS / 60)) min): $(grep -m 1 -o 'No match found.*' npm-view.log || head -n 1 npm-view.log)"
            sleep 30
          done
          if [ "$published" != "$INTEGRITY" ]; then
            echo "::error::npm serves $PACKAGE as \"$published\", not the tested $INTEGRITY."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if npm install --global "$PACKAGE"; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            echo "npm lists $PACKAGE but could not install it yet; its package list may still be cached. Trying again in a minute."
            sleep 60
          done
          node tests/package/smoke.mjs "$(npm prefix --global)" --version "$VERSION" --yard-art

  registry:
    name: Publish to the MCP Registry
    needs: [plan, confirm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: server.json
          sparse-checkout-cone-mode: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::warning::$VERSION is not in the MCP Registry: the MCP_PRIVATE_KEY secret is not set."
            exit 0
          fi
          name=$(jq -r .name server.json)
          if curl --fail --silent --output /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n | @uri')/versions/$VERSION"; then
            echo "$name $VERSION is already in the MCP Registry."
            exit 0
          fi
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar -xzf "$archive" mcp-publisher
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login dns --domain oddessentials.ai --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish

  pages-build:
    name: Build Pages demo
    needs: [plan, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/package"
          sha256sum --check SHA256SUMS
          mkdir "$RUNNER_TEMP/released"
          tar -xzf ./*.tgz -C "$RUNNER_TEMP/released"
          packed=$(node -p "require('$RUNNER_TEMP/released/package/package.json').version")
          [ "$packed" = "$VERSION" ] || { echo "::error::The Pages source is $packed, not release $VERSION."; exit 1; }
          cd "$GITHUB_WORKSPACE"
          node scripts/yard-pack.mjs --extract "$RUNNER_TEMP"/package/yard-art-*.tar.gz \
            --manifest "$RUNNER_TEMP/released/package/web/yard/art.json" \
            --into "$RUNNER_TEMP/released/package/web/yard/assets"
          node docs/demo/build.mjs \
            --source "$RUNNER_TEMP/released/package/web" \
            --modules "$RUNNER_TEMP/released/package/node_modules" \
            --version "$VERSION"
          node docs/demo/check.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.pages
          include-hidden-files: true

  pages-deploy:
    name: Deploy Pages demo
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
