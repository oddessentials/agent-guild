# Smart App Control blocks node-pty's unsigned Windows modules. A release, or the signing check,
# signs its own copies here; ci.yml packs them in place of node-pty's and checks the tarball.
name: Sign Windows modules

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sign:
    name: Sign Windows modules
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - id: stage
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'windows-modules'
          $files = node tests/package/check-tarball.mjs --windows-modules | ForEach-Object {
            $to = [IO.Path]::GetFullPath((Join-Path $dir $_))
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Copy-Item -LiteralPath $_ $to
            $to
          }
          "files<<EOF`n$($files -join "`n")`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: agent-guild-signing
          certificate-profile-name: agent-guild-public
          files: ${{ steps.stage.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-modules
          path: ${{ runner.temp }}/windows-modules/
          if-no-files-found: error
          retention-days: 7
