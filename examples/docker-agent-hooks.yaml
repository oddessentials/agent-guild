# Docker Agent hook that shows a running shell command on the card in
# autonomous mode (--yolo, --safety autonomous). Save as
# ~/.config/cagent/hooks.d/agent-guild-autonomous.yaml (or under the folder
# DOCKER_AGENT_CONFIG_DIR names). Outside an Agent Guild session the command
# does nothing.
#
# Agent Guild passes session_start, pre_tool_use, post_tool_use, stop and
# session_end to every session it starts, and the Docker Agent card's
# Model reporting switch adds the model. In autonomous mode Docker Agent skips
# the ordinary pre_tool_use hooks, so a command shows only once it ends.
# preempt_yolo runs this one in every mode, before Docker Agent asks for
# approval: in the approval modes a command then shows as running while it
# waits for you.
pre_tool_use:
  - matcher: shell
    preempt_yolo: true
    hooks:
      - type: command
        command: agent-guild-report --hook --docker
